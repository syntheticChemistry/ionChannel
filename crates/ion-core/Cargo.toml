[package]
name = "ion-core"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
description = "Core types and abstractions for ionChannel remote desktop"
authors.workspace = true
repository.workspace = true

[dependencies]
# Async trait for backend abstraction
async-trait = "0.1"

# Async utilities for parallel operations
futures = "0.3"

# Error handling
thiserror.workspace = true

# Serialization (for D-Bus)
serde.workspace = true
serde_json = "1.0"

# Async primitives
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }

# Bitflags for device types and capabilities
bitflags = "2.4"

# UUID for grant IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling for grant restrictions
chrono = { version = "0.4", features = ["serde"] }

# Derive macros for zbus
zvariant.workspace = true

[dev-dependencies]
tempfile = "3.8"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true

